services:
  - type: web
    name: skein-reader
    runtime: node
    plan: free
    rootDir: reader
    buildCommand: npm install
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SKEIN_REPLAY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: SKEIN_SALT
        sync: false
      - key: NEXT_PUBLIC_SALT
        sync: false
